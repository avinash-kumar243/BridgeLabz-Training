server:
  port: 8081

spring:
  application:
    name: auth-service

  # MySQL Database
  datasource:
    url: jdbc:mysql://localhost:3306/fundoo_notes_auth_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # JMS - ActiveMQ Artemis
  artemis:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

  # SMTP Email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

# Eureka Discovery Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: false

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
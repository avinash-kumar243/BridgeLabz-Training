# Applciation Name
spring:
  application:
    name: ContactsApp

  # H2 Database
  datasource:
    url: jdbc:h2:mem:contactsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console  
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true